<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Panel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fb;
      height: 100vh; height: 100dvh;
      display: flex; align-items: center; justify-content: center;
      color: #1a1a2e; overflow: hidden; margin: 0;
    }
    .container {
      width: 100%; max-width: 440px;
      height: 100vh; height: 100dvh;
      background: #fff;
      display: flex; flex-direction: column; overflow: hidden;
      position: relative;
    }
    @media (min-width: 500px) {
      .container { border-radius: 20px; box-shadow: 0 10px 50px rgba(0,0,0,0.08); min-height: 400px; height: 90vh; height: 90dvh; }
    }

    .screen { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .screen.active { display: flex; }

    /* ── Dashboard ── */
    .dash-header {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      padding: 0.8rem 1rem; color: #fff; flex-shrink: 0;
      display: flex; align-items: center; gap: 0.6rem;
    }
    .dash-header h3 { font-size: 0.95rem; font-weight: 600; flex: 1; }
    .user-list { flex: 1; overflow-y: auto; padding: 0.5rem; }
    .user-item {
      display: flex; align-items: center; gap: 0.6rem;
      padding: 0.65rem 0.7rem; border-radius: 12px;
      cursor: pointer; transition: background 0.15s;
    }
    .user-item:hover { background: #f0eeff; }
    .user-item .ic {
      width: 36px; height: 36px; border-radius: 50%;
      background: #e0e7ff; color: #4f46e5;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
    }
    .user-item .ic.blk { background: #fef2f2; color: #ef4444; }
    .user-item .info { flex: 1; min-width: 0; }
    .user-item .info .nm { font-size: 0.75rem; font-weight: 600; color: #1a1a2e; }
    .user-item .info .prev { font-size: 0.72rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .user-item .blk-badge { font-size: 0.6rem; background: #fef2f2; color: #ef4444; padding: 2px 7px; border-radius: 8px; font-weight: 600; }
    .user-item .blk-act {
      font-size: 0.7rem; background: none; border: 1px solid #ccc; border-radius: 8px;
      padding: 3px 10px; cursor: pointer; font-family: inherit; color: #555;
      transition: all 0.15s;
    }
    .user-item .blk-act:hover { border-color: #ef4444; color: #ef4444; }
    .no-usr { text-align: center; padding: 2rem 1rem; color: #888; font-size: 0.85rem; }

    /* ── Category Tabs ── */
    .dash-tabs {
      display: flex; border-bottom: 1px solid #eee; flex-shrink: 0;
    }
    .dash-tab {
      flex: 1; padding: 0.6rem; text-align: center;
      font-size: 0.78rem; font-weight: 600; color: #888;
      cursor: pointer; border: none; background: none; font-family: inherit;
      transition: all 0.2s; position: relative;
    }
    .dash-tab:hover { color: #4f46e5; }
    .dash-tab.active { color: #4f46e5; }
    .dash-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 10%; width: 80%; height: 2px;
      background: #4f46e5; border-radius: 2px;
    }
    .dash-tab .cnt {
      display: inline-block; font-size: 0.6rem; background: #e0e7ff; color: #4f46e5;
      padding: 1px 6px; border-radius: 8px; margin-left: 4px; font-weight: 700;
    }

    /* ── Chat ── */
    .chat-header {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      padding: 0.7rem 1rem; color: #fff; flex-shrink: 0;
      display: flex; align-items: center; gap: 0.5rem;
    }
    .chat-header .back { background: none; border: none; color: #fff; font-size: 1.2rem; cursor: pointer; padding: 0; line-height: 1; }
    .chat-header .info { flex: 1; min-width: 0; }
    .chat-header .info h4 { font-size: 0.9rem; font-weight: 600; }
    .chat-header .info p { font-size: 0.65rem; opacity: 0.8; }
    .chat-header .blk {
      font-size: 0.7rem; background: rgba(255,255,255,0.15); border: none; color: #fff;
      padding: 4px 12px; border-radius: 10px; cursor: pointer; font-family: inherit;
      font-weight: 600; transition: background 0.2s;
    }
    .chat-header .blk:hover { background: rgba(239,68,68,0.4); }
    .chat-header .blk.on { background: rgba(239,68,68,0.3); }
    .chat-msgs {
      flex: 1; padding: 1rem; overflow-y: auto;
      display: flex; flex-direction: column; gap: 0.6rem;
    }
    .chat-msgs .msg {
      max-width: 85%; padding: 0.6rem 0.9rem; border-radius: 14px;
      font-size: 0.85rem; line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .chat-msgs .msg.team {
      background: #4f46e5;
      color: #fff;
      align-self: flex-end;
      border-radius: 16px 16px 4px 16px;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.15);
    }
    .chat-msgs .msg.user {
      background: #eff6ff;
      color: #1e40af;
      align-self: flex-start;
      border-radius: 16px 16px 16px 4px;
      border: 1px solid #dbeafe;
      box-shadow: 0 2px 4px rgba(30, 64, 175, 0.05);
    }
    .chat-msgs .msg.bot {
      background: #f9fafb;
      color: #6b7280;
      align-self: flex-start;
      border-radius: 16px 16px 16px 4px;
      font-style: italic;
      border: 1px solid #f3f4f6;
    }
    .chat-msgs .msg .s {
      font-weight: 700;
      font-size: 0.72rem;
      display: block;
      margin-bottom: 3px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .chat-msgs .msg.team .s {
      color: rgba(255, 255, 255, 0.8);
    }
    .chat-msgs .msg.user .s {
      color: #2563eb;
    }
    .chat-msgs .msg.bot .s {
      color: #9ca3af;
    }
    .chat-msgs .msg.has-image {
      padding: 4px;
      max-width: 78%;
    }
    .chat-msgs .msg.user.has-image { background: transparent !important; }
    .chat-msgs .msg.team.has-image { background: #4f46e5 !important; padding: 6px; }
    .chat-msgs .msg.has-image .s { padding: 0 4px; }
    .chat-msgs .msg .msg-image {
      max-width: min(220px, 100%);
      max-height: 240px;
      width: auto;
      height: auto;
      border-radius: 12px;
      display: block;
      cursor: pointer;
      object-fit: contain;
      border: 1px solid rgba(0,0,0,0.06);
    }
    .chat-msgs .msg.user.has-image .msg-image { border-radius: 12px 12px 12px 4px; }
    .chat-msgs .msg.team.has-image .msg-image { border-radius: 12px 12px 4px 12px; border-color: rgba(255,255,255,0.15); }
    .chat-msgs .msg .msg-image-caption {
      padding: 0.35rem 0.5rem 0.25rem;
      font-size: 0.82rem;
      line-height: 1.35;
      word-wrap: break-word;
    }
    .chat-msgs .msg.user.has-image .msg-image-caption { color: #1a1a2e; }
    .chat-msgs .msg.team.has-image .msg-image-caption { color: #fff; }
    .img-viewer-top #ivTitle { flex: 1; font-size: 0.9rem; font-weight: 600; }
    .chat-input-area {
      display: flex; align-items: flex-end; gap: 0.5rem;
      padding: 0.6rem 0.8rem; border-top: 1px solid #eee; flex-shrink: 0;
    }
    .chat-input-area textarea {
      flex: 1; padding: 0.6rem 0.9rem;
      border: 1.5px solid #e0e0e0; border-radius: 20px;
      font-family: inherit; font-size: 0.85rem; outline: none;
      resize: none;
      height: 36px;
      max-height: 120px;
      line-height: 1.4;
      overflow-y: auto;
      box-sizing: border-box;
    }
    .chat-input-area textarea:focus { border-color: #4f46e5; }
    .chat-input-area .btn {
      width: 36px; height: 36px; border: none; border-radius: 50%;
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #fff; display: flex; align-items: center; justify-content: center;
      cursor: pointer; flex-shrink: 0; font-size: 1.1rem;
    }
.chat-input-area .btn.cam { background: #e0e7ff; color: #4f46e5; }

    /* ── Fullscreen Image Viewer ── */
    .img-viewer {
      display: none; position: fixed; inset: 0; z-index: 1000;
      background: #000; flex-direction: column;
    }
    .img-viewer.show { display: flex; }
    .img-viewer-top {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.6rem 1rem;
      background: rgba(0,0,0,0.8); color: #fff; flex-shrink: 0; z-index: 2;
    }
    .img-viewer-top .iv-back { background: none; border: none; color: #fff; cursor: pointer; padding: 4px; display: flex; align-items: center; justify-content: center; }
    .img-viewer-top .iv-label { font-size: 0.85rem; opacity: 0.7; margin-left: auto; }
    .img-viewer-body { flex: 1; position: relative; overflow: hidden; touch-action: none; }
    .img-viewer-body img {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(1);
      max-width: 100%; max-height: 100%; object-fit: contain;
      user-select: none; -webkit-user-drag: none; will-change: transform;
    }
    .img-viewer-body img.zoomed { max-width: none; max-height: none; }

    /* ── Image Editor Modal (WhatsApp-style) ── */
    .img-editor {
      display: none; position: fixed; inset: 0; z-index: 2000; background: #000;
    }
    .img-editor.show { display: block; }
    .ie-top-bar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 30;
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.8rem;
      background: linear-gradient(rgba(0,0,0,0.7), transparent);
    }
    .ie-top-bar #ieCounter { flex: 1; text-align: center; font-size: 0.9rem; font-weight: 600; color: #fff; }
    .ie-btn {
      width: 38px; height: 38px; border: none; background: transparent; color: #fff;
      border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s;
    }
    .ie-btn:hover { background: rgba(255, 255, 255, 0.12); }
    .ie-image-area {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      overflow: hidden; position: relative; background: #111;
    }
    .ie-image-wrap {
      position: relative; display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; padding: 56px 0 140px; box-sizing: border-box;
    }
    .ie-image-wrap img {
      display: block; max-width: 100%; max-height: 100%; object-fit: contain;
      transition: transform 0.2s; user-select: none; -webkit-user-drag: none;
    }
    .ie-canvas-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      cursor: crosshair; touch-action: none; z-index: 10;
    }
    .ie-bottom-bar {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
      background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding-top: 24px;
    }
    .ie-tools {
      display: flex; align-items: center; justify-content: center; gap: 0.2rem;
      padding: 0.4rem 0.5rem; background: rgba(26, 26, 46, 0.85);
    }
    .ie-tool {
      width: 40px; height: 40px; border: none; background: transparent; color: rgba(255,255,255,0.6);
      border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s;
    }
    .ie-tool:hover { background: rgba(255,255,255,0.08); color: #fff; }
    .ie-tool.active { background: rgba(99,102,241,0.25); color: #818cf8; }
    .ie-colors {
      position: absolute; top: 56px; right: 12px; display: flex; flex-direction: column;
      align-items: center; gap: 4px; z-index: 20;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
      padding: 5px 4px; border-radius: 10px; transition: opacity 0.15s;
    }
    .ie-colors.hidden { opacity: 0; pointer-events: none; }
    .ie-color-btn {
      width: 16px; height: 16px; border-radius: 50%;
      border: 1.5px solid transparent; cursor: pointer; flex-shrink: 0;
      transition: all 0.15s; padding: 0;
    }
    .ie-color-btn.active { border-color: #818cf8; transform: scale(1.3); box-shadow: 0 0 0 2px rgba(129,140,248,0.3); }
    .ie-color-btn:hover { transform: scale(1.2); }
    .ie-send-area {
      display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.8rem;
      background: rgba(26, 26, 46, 0.85);
    }
    .ie-send-area input {
      flex: 1; padding: 0.65rem 1rem; border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 24px; background: rgba(255,255,255,0.06); font-family: inherit;
      font-size: 0.9rem; color: #fff; outline: none;
    }
    .ie-send-area input::placeholder { color: rgba(255,255,255,0.35); }
    .ie-send-area input:focus { border-color: rgba(99,102,241,0.5); }
    .ie-send-btn {
      width: 42px; height: 42px; border: none; background: #4f46e5; color: #fff;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.2s; flex-shrink: 0;
    }
    .ie-send-btn:hover { background: #4338ca; }
    .ie-tool-divider { width: 1px; height: 24px; background: rgba(255,255,255,0.12); margin: 0 0.2rem; }
    .ie-tool-done { color: #4ade80 !important; }
    .ie-tool-done:hover { background: rgba(74,222,128,0.15) !important; }

  </style>
</head>
<body>
<div class="container">

  <!-- Dashboard -->
  <div class="screen active" id="dashScreen">
    <div class="dash-header">
      <h3>Team Panel</h3>
    </div>
    <div class="dash-tabs">
      <button class="dash-tab active" data-cat="withdrawal">Withdrawal <span class="cnt" id="wCount">0</span></button>
      <button class="dash-tab" data-cat="account">Account <span class="cnt" id="aCount">0</span></button>
      <button class="dash-tab" data-cat="promotion">Promotion <span class="cnt" id="pCount">0</span></button>
    </div>
    <div class="user-list" id="userList"><div class="no-usr">Loading...</div></div>
  </div>

  <!-- Chat -->
  <div class="screen" id="chatScreen">
    <div class="chat-header">
      <button class="back" id="chatBack">&larr;</button>
      <div class="info">
        <h4 id="chatTitle">User</h4>
        <p id="chatSub">No messages</p>
      </div>
      <button class="blk" id="blockBtn">Block</button>
    </div>
    <div class="chat-msgs" id="chatMsgs"></div>
    <div class="chat-input-area">
      <button class="btn cam" id="camBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      </button>
      <textarea id="chatInput" placeholder="Type a message..." autocomplete="off" rows="1"></textarea>
      <button class="btn" id="sendBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

</div>

<!-- Image Editor Modal (WhatsApp-style) -->
<div class="img-editor" id="imgEditor">
    <div class="ie-top-bar">
      <button class="ie-btn" id="ieBack" title="Back">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      </button>
      <span id="ieCounter">1/1</span>
      <button class="ie-btn" id="ieDeleteImg" title="Remove image">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
      </button>
    </div>

    <div class="ie-image-area" id="ieImageArea">
      <div class="ie-image-wrap" id="ieImageWrap">
        <img id="ieImage" src="" alt="Edit image" />
      </div>
      <div class="ie-colors hidden" id="ieColors">
        <button class="ie-color-btn active" data-color="#ffffff" style="background:#ffffff;border-color:#ffffff"></button>
        <button class="ie-color-btn" data-color="#000000" style="background:#000000"></button>
        <button class="ie-color-btn" data-color="#ef4444" style="background:#ef4444"></button>
        <button class="ie-color-btn" data-color="#f97316" style="background:#f97316"></button>
        <button class="ie-color-btn" data-color="#eab308" style="background:#eab308"></button>
        <button class="ie-color-btn" data-color="#22c55e" style="background:#22c55e"></button>
        <button class="ie-color-btn" data-color="#3b82f6" style="background:#3b82f6"></button>
        <button class="ie-color-btn" data-color="#a855f7" style="background:#a855f7"></button>
        <button class="ie-color-btn" data-color="#ec4899" style="background:#ec4899"></button>
      </div>
    </div>

    <div class="ie-bottom-bar">
      <div class="ie-tools">
        <button class="ie-tool" id="ieToolArrow" title="Arrow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="12 5 19 5 19 12"/></svg>
        </button>
        <button class="ie-tool" id="ieToolUndo" title="Undo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
        </button>
        <div class="ie-tool-divider"></div>
        <button class="ie-tool ie-tool-done" id="ieToolDone">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </button>
      </div>
      <div class="ie-send-area">
        <input type="text" id="ieCaption" placeholder="Add a caption..." autocomplete="off" />
        <button class="ie-send-btn" id="ieSendBtn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

<!-- Image Viewer -->
<div class="img-viewer" id="imgViewer">
  <div class="img-viewer-top">
    <button class="iv-back" id="ivBack" type="button" aria-label="Close">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <span id="ivTitle">Image</span>
    <span class="iv-label" id="ivSender">Team</span>
  </div>
  <div class="img-viewer-body">
    <img id="ivImage" src="" alt="Full image" />
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" style="display:none" />

<script>
// ─── Supabase ──────────────────────────────────────────
const SUPABASE_URL = 'https://eunvrbrlyijfmmzruvla.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV1bnZyYnJseWlqZm1tenJ1dmxhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODMwNzMwOTMsImV4cCI6MjA5ODY0OTA5M30._2xPgeRfOwHYANUF8LPZSviUgIEV0-OS9O8Zl9-PWL0';
const SB = {
  async insert(table, data) { const r = await fetch(SUPABASE_URL + '/rest/v1/' + table, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Prefer': 'return=representation', apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, body: JSON.stringify(data) }); const t = await r.text(); try { return JSON.parse(t)[0]; } catch { return null; } },
  async select(table, opts) {
    let url = SUPABASE_URL + '/rest/v1/' + table + '?select=*';
    if (opts?.order) url += '&order=' + opts.order;
    if (opts?.filter) { const f = opts.filter; url += '&' + f.field + '=eq.' + encodeURIComponent(f.value); }
    const r = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
    return r.json();
  },
  async deleteBy(table, field, value) { const r = await fetch(SUPABASE_URL + '/rest/v1/' + table + '?' + field + '=eq.' + encodeURIComponent(value), { method: 'DELETE', headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } }); return r.json(); },
};

document.addEventListener('DOMContentLoaded', () => {
// ─── State ─────────────────────────────────────────────
let currentUserFP = null;
let currentCategory = 'withdrawal';
let cachedMsgs = [];
let cachedBlocked = [];

// ─── Local cache ─────────────────────────────────────
function loadCache() {
  try { const d = JSON.parse(localStorage.getItem('adm_msg_cache')); if (d) cachedMsgs = d; } catch {}
}
function saveCache() {
  try { localStorage.setItem('adm_msg_cache', JSON.stringify(cachedMsgs)); } catch {}
}
loadCache();

// ─── DOM refs ──────────────────────────────────────────
const dashScreen = document.getElementById('dashScreen');
const chatScreen = document.getElementById('chatScreen');
const userList = document.getElementById('userList');

// ─── Dashboard ─────────────────────────────────────────
function showScreen(el) {
  [dashScreen, chatScreen].forEach(s => s.classList.remove('active'));
  if (el) el.classList.add('active');
}

async function fetchNewMsgs() {
  const maxId = cachedMsgs.reduce((m, x) => Math.max(m, x.id || 0), 0);
  let url = SUPABASE_URL + '/rest/v1/messages?select=*&order=created_at.asc';
  if (maxId > 0) url += '&id=gt.' + maxId;
  try {
    const r = await fetch(url, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
    const newMsgs = await r.json();
    if (newMsgs && newMsgs.length) {
      cachedMsgs = cachedMsgs.concat(newMsgs);
      saveCache();
    }
  } catch {}
}

async function renderDash() {
  await fetchNewMsgs();

  // Fetch blocked
  const blockedRows = await SB.select('blocked_fps');
  cachedBlocked = blockedRows.map(b => b.fingerprint);

  // Count per category
  const cats = ['withdrawal', 'account', 'promotion'];
  const catCounts = {};
  const catUnread = {};
  for (const cat of cats) {
    const catFps = [...new Set(cachedMsgs.filter(m => m.category === cat).map(m => m.fingerprint))];
    catCounts[cat] = catFps.length;
    catUnread[cat] = cachedMsgs.filter(m => m.category === cat && (m.sender === 'user' || m.sender === 'bot') && !m.read).length;
  }
  wCount.textContent = catCounts.withdrawal + (catUnread.withdrawal ? ' (' + catUnread.withdrawal + ')' : '');
  aCount.textContent = catCounts.account + (catUnread.account ? ' (' + catUnread.account + ')' : '');
  pCount.textContent = catCounts.promotion + (catUnread.promotion ? ' (' + catUnread.promotion + ')' : '');

  document.querySelectorAll('.dash-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === currentCategory));

  // Get unique fingerprints for this category
  const fps = [...new Set(cachedMsgs.filter(m => m.category === currentCategory).map(m => m.fingerprint))];

  if (!fps.length) {
    userList.innerHTML = '<div class="no-usr">No users in this category</div>';
    return;
  }
  userList.innerHTML = fps.map(fp => {
    const userMsgs = cachedMsgs.filter(m => m.fingerprint === fp && m.category === currentCategory);
    const last = userMsgs[userMsgs.length - 1];
    const isBlk = cachedBlocked.includes(fp);
    const unread = userMsgs.filter(m => (m.sender === 'user' || m.sender === 'bot') && !m.read).length;
    const prevText = last ? (last.text.startsWith('[Image]') ? '📷 ' + last.text : last.text.slice(0, 40)) : '';
    return `
      <div class="user-item" data-fp="${fp}">
        <span class="ic ${isBlk ? 'blk' : ''}">${isBlk ? '!' : '#'}</span>
        <div class="info">
          <div class="nm">${fp.slice(0,8)}... ${isBlk ? '<span class="blk-badge">Blocked</span>' : ''} ${unread ? '<span class="blk-badge" style="background:#4f46e5;color:#fff">' + unread + '</span>' : ''}</div>
          <div class="prev">${prevText}</div>
        </div>
        <button class="blk-act" data-fp="${fp}">${isBlk ? 'Unblock' : 'Block'}</button>
      </div>
    `;
  }).join('');
  userList.querySelectorAll('.user-item').forEach(item => {
    item.addEventListener('click', e => {
      if (e.target.classList.contains('blk-act')) return;
      currentUserFP = item.dataset.fp;
      openChat();
    });
  });
  userList.querySelectorAll('.blk-act').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const fp = btn.dataset.fp;
      if (cachedBlocked.includes(fp)) {
        await SB.deleteBy('blocked_fps', 'fingerprint', fp);
      } else {
        await SB.insert('blocked_fps', { fingerprint: fp });
      }
      renderDash();
    });
  });
}

document.querySelectorAll('.dash-tab').forEach(tab => {
  tab.addEventListener('click', () => {
    currentCategory = tab.dataset.cat;
    renderDash();
  });
});

// ─── Chat ──────────────────────────────────────────────
function openChat() {
  if (!currentUserFP) return;
  const userMsgs = cachedMsgs.filter(m => m.fingerprint === currentUserFP && m.category === currentCategory);
  // Mark as read
  let changed = false;
  for (const m of cachedMsgs) {
    if (m.fingerprint === currentUserFP && m.category === currentCategory && (m.sender === 'user' || m.sender === 'bot') && !m.read) {
      m.read = true; changed = true;
    }
  }
  if (changed) saveCache();
  const allUserMsgs = cachedMsgs.filter(m => m.fingerprint === currentUserFP);
  const isBlk = cachedBlocked.includes(currentUserFP);
  chatTitle.textContent = 'User ' + currentUserFP.slice(0,8) + '...';
  chatSub.textContent = isBlk ? 'Blocked' : (userMsgs.length + ' messages in ' + currentCategory);
  blockBtn.textContent = isBlk ? 'Unblock' : 'Block';
  blockBtn.classList.toggle('on', isBlk);
  renderChatMsgs(userMsgs);
  showScreen(chatScreen);
  chatInput.focus();
}

function renderChatMsgs(msgs) {
  chatMsgs.innerHTML = '';
  msgs.forEach(m => {
    const senderLabel = m.sender === 'user' ? 'User' : (m.sender === 'bot' ? 'Bot' : 'Team');
    const senderClass = m.sender === 'user' ? 'user' : (m.sender === 'bot' ? 'bot' : 'team');
    const isImage = m.text && m.text.startsWith('[Image]');
    const caption = isImage ? m.text.replace('[Image]', '').replace(/^:\s*/, '').trim() : '';

    const div = document.createElement('div');
    div.className = 'msg ' + senderClass;
    if (m.image) div.classList.add('has-image');

    const label = document.createElement('span');
    label.className = 's';
    label.textContent = senderLabel;
    div.appendChild(label);

    if (m.image) {
      if (caption) {
        const cap = document.createElement('div');
        cap.className = 'msg-image-caption';
        cap.textContent = caption;
        div.appendChild(cap);
      }
      const img = document.createElement('img');
      img.className = 'msg-image';
      img.src = m.image;
      img.alt = caption || 'Image';
      img.dataset.role = m.sender === 'team' ? 'team' : 'user';
      img.addEventListener('click', () => openImageViewer(m.image, img.dataset.role));
      div.appendChild(img);
    } else {
      const textEl = document.createElement('div');
      textEl.textContent = m.text;
      div.appendChild(textEl);
    }

    chatMsgs.appendChild(div);
  });
  chatMsgs.scrollTop = chatMsgs.scrollHeight;
}

function escHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// ─── Fullscreen Image Viewer ───────────────────────────
let viewerImages = [];
let viewerIndex = 0;
let viewerScale = 1;
let viewerTx = 0;
let viewerTy = 0;
let viewerTouchStartX = 0;
let viewerTouchStartY = 0;
let viewerStartTx = 0;
let viewerStartTy = 0;
let viewerStartScale = 1;
let viewerPinchDist = 0;
let viewerPinchCenterX = 0;
let viewerPinchCenterY = 0;
let viewerSwiping = false;
let viewerSwipeStartX = 0;
let viewerLastTap = 0;

function openImageViewer(src, role) {
  viewerImages = Array.from(document.querySelectorAll('.msg-image')).map(img => ({ src: img.src, role: img.dataset.role || 'user' }));
  viewerIndex = viewerImages.findIndex(i => i.src === src);
  if (viewerIndex < 0) viewerIndex = 0;
  viewerScale = 1; viewerTx = 0; viewerTy = 0;
  showViewerImage(role);
  imgViewer.classList.add('show');
}

function clampPan() {
  const cw = viewerBody.clientWidth;
  const ch = viewerBody.clientHeight;
  const nw = ivImage.naturalWidth || cw;
  const nh = ivImage.naturalHeight || ch;
  const dispW = nw * viewerScale;
  const dispH = nh * viewerScale;
  const maxTx = Math.max(0, (dispW - cw) / 2);
  const maxTy = Math.max(0, (dispH - ch) / 2);
  viewerTx = Math.max(-maxTx, Math.min(maxTx, viewerTx));
  viewerTy = Math.max(-maxTy, Math.min(maxTy, viewerTy));
}

function applyViewerTransform() {
  ivImage.classList.toggle('zoomed', viewerScale > 1);
  if (viewerScale > 1) clampPan(); else { viewerTx = 0; viewerTy = 0; }
  ivImage.style.transform = `translate(calc(-50% + ${viewerTx}px), calc(-50% + ${viewerTy}px)) scale(${viewerScale})`;
}

function showViewerImage(fallbackRole) {
  const item = viewerImages[viewerIndex];
  if (!item) return;
  ivImage.src = item.src;
  viewerScale = 1; viewerTx = 0; viewerTy = 0;
  ivImage.style.transform = 'translate(-50%, -50%) scale(1)';
  ivImage.classList.remove('zoomed');
  ivTitle.textContent = `Image ${viewerIndex + 1}/${viewerImages.length}`;
  const role = item.role || fallbackRole || 'user';
  ivSender.textContent = role === 'team' ? 'Team' : 'User';
}

function closeImageViewer() {
  imgViewer.classList.remove('show');
  viewerScale = 1; viewerTx = 0; viewerTy = 0;
}

if (viewerBody) {
  viewerBody.addEventListener('touchstart', (e) => {
    if (e.touches.length === 1) {
      viewerTouchStartX = e.touches[0].clientX;
      viewerTouchStartY = e.touches[0].clientY;
      viewerStartTx = viewerTx;
      viewerStartTy = viewerTy;
      viewerStartScale = viewerScale;
      viewerSwipeStartX = e.touches[0].clientX;
      viewerSwiping = viewerScale <= 1;
    } else if (e.touches.length === 2) {
      viewerPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      viewerStartScale = viewerScale;
      viewerStartTx = viewerTx;
      viewerStartTy = viewerTy;
      viewerPinchCenterX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      viewerPinchCenterY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    }
  }, { passive: true });

  viewerBody.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const rect = viewerBody.getBoundingClientRect();
      const pinchRelX = viewerPinchCenterX - rect.left - rect.width / 2;
      const pinchRelY = viewerPinchCenterY - rect.top - rect.height / 2;
      const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      const newScale = Math.max(0.5, Math.min(5, viewerStartScale * (dist / viewerPinchDist)));
      const actualRatio = newScale / viewerStartScale;
      viewerTx = pinchRelX * (1 - actualRatio) + viewerStartTx * actualRatio;
      viewerTy = pinchRelY * (1 - actualRatio) + viewerStartTy * actualRatio;
      viewerScale = newScale;
      applyViewerTransform();
    } else if (e.touches.length === 1 && viewerScale > 1) {
      e.preventDefault();
      viewerTx = viewerStartTx + (e.touches[0].clientX - viewerTouchStartX);
      viewerTy = viewerStartTy + (e.touches[0].clientY - viewerTouchStartY);
      applyViewerTransform();
    } else if (e.touches.length === 1 && viewerScale <= 1 && viewerSwiping) {
      e.preventDefault();
      const dx = e.touches[0].clientX - viewerSwipeStartX;
      ivImage.style.transform = `translate(calc(-50% + ${dx * 0.3}px), -50%) scale(1)`;
    }
  }, { passive: false });

  viewerBody.addEventListener('touchend', (e) => {
    if (e.touches.length === 1) {
      viewerTouchStartX = e.touches[0].clientX;
      viewerTouchStartY = e.touches[0].clientY;
      viewerStartTx = viewerTx;
      viewerStartTy = viewerTy;
      viewerStartScale = viewerScale;
    }
    if (e.changedTouches.length === 1 && viewerScale <= 1) {
      const dx = e.changedTouches[0].clientX - viewerSwipeStartX;
      if (Math.abs(dx) > 50) {
        if (dx > 0 && viewerIndex > 0) { viewerIndex--; showViewerImage(); }
        else if (dx < 0 && viewerIndex < viewerImages.length - 1) { viewerIndex++; showViewerImage(); }
        else applyViewerTransform();
      } else applyViewerTransform();
    }
    if (e.changedTouches.length === 1) {
      const now = Date.now();
      if (now - viewerLastTap < 300 && now - viewerLastTap > 50) {
        if (viewerScale > 1.5) { viewerScale = 1; viewerTx = 0; viewerTy = 0; }
        else {
          const rect = viewerBody.getBoundingClientRect();
          const tapRelX = e.changedTouches[0].clientX - rect.left - rect.width / 2;
          const tapRelY = e.changedTouches[0].clientY - rect.top - rect.height / 2;
          const tapRatio = 3 / viewerScale;
          viewerTx = tapRelX * (1 - tapRatio) + viewerTx * tapRatio;
          viewerTy = tapRelY * (1 - tapRatio) + viewerTy * tapRatio;
          viewerScale = 3;
        }
        applyViewerTransform();
        viewerLastTap = 0;
        return;
      }
      viewerLastTap = now;
    }
  }, { passive: true });

  viewerBody.addEventListener('wheel', (e) => {
    if (!imgViewer.classList.contains('show')) return;
    e.preventDefault();
    const rect = viewerBody.getBoundingClientRect();
    const mouseRelX = e.clientX - rect.left - rect.width / 2;
    const mouseRelY = e.clientY - rect.top - rect.height / 2;
    const ratio = e.deltaY > 0 ? 0.9 : 1.1;
    const newScale = Math.max(0.5, Math.min(5, viewerScale * ratio));
    const actualRatio = newScale / viewerScale;
    viewerTx = mouseRelX * (1 - actualRatio) + viewerTx * actualRatio;
    viewerTy = mouseRelY * (1 - actualRatio) + viewerTy * actualRatio;
    viewerScale = newScale;
    applyViewerTransform();
  }, { passive: false });

  let viewerMouseDown = false, viewerMouseStartX = 0, viewerMouseStartY = 0, viewerMouseTx = 0, viewerMouseTy = 0;
  viewerBody.addEventListener('mousedown', (e) => {
    if (!imgViewer.classList.contains('show')) return;
    viewerMouseDown = true;
    viewerMouseStartX = e.clientX;
    viewerMouseStartY = e.clientY;
    viewerMouseTx = viewerTx;
    viewerMouseTy = viewerTy;
  });
  document.addEventListener('mousemove', (e) => {
    if (!viewerMouseDown || viewerScale <= 1) return;
    viewerTx = viewerMouseTx + (e.clientX - viewerMouseStartX);
    viewerTy = viewerMouseTy + (e.clientY - viewerMouseStartY);
    applyViewerTransform();
  });
  document.addEventListener('mouseup', () => { viewerMouseDown = false; });
}

ivBack.addEventListener('click', closeImageViewer);
document.addEventListener('keydown', (e) => {
  if (!imgViewer.classList.contains('show')) return;
  if (e.key === 'Escape') closeImageViewer();
  if (e.key === 'ArrowLeft' && viewerIndex > 0) { viewerIndex--; showViewerImage(); }
  if (e.key === 'ArrowRight' && viewerIndex < viewerImages.length - 1) { viewerIndex++; showViewerImage(); }
});

chatBack.addEventListener('click', () => { currentUserFP = null; renderDash(); showScreen(dashScreen); });

blockBtn.addEventListener('click', async () => {
  if (!currentUserFP) return;
  if (cachedBlocked.includes(currentUserFP)) {
    await SB.deleteBy('blocked_fps', 'fingerprint', currentUserFP);
  } else {
    await SB.insert('blocked_fps', { fingerprint: currentUserFP });
  }
  openChat();
});

// ─── Send text ────────────────────────────────────────
async function sendMsg() {
  const text = chatInput.value.trim();
  if (!text || !currentUserFP) return;
  const result = await SB.insert('messages', { fingerprint: currentUserFP, sender: 'team', text, category: currentCategory, sender_fp: 'AZC92M46' });
  chatInput.value = '';
  chatInput.style.height = '36px'; // Reset height
  if (result && result.id) {
    cachedMsgs.push(result);
    saveCache();
  }
  const userMsgs = cachedMsgs.filter(m => m.fingerprint === currentUserFP && m.category === currentCategory);
  renderChatMsgs(userMsgs);
  chatSub.textContent = userMsgs.length + ' messages in ' + currentCategory;
}

sendBtn.addEventListener('click', sendMsg);
chatInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMsg();
  }
});
chatInput.addEventListener('input', () => {
  chatInput.style.height = '36px';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 120) + 'px';
});

// ─── Send image + Editor ───────────────────────────────
let editImages = [];
let editIndex = 0;
let editMode = 'none';
let editCanvas = null;
let editCtx = null;
let editUndoStack = [];
let imageCaptions = [];
let imageDrawings = [];
let editColor = '#ffffff';
let arrowObjects = [];
let isDrawingArrow = false;
let arrowStart = null;
let arrowEnd = null;
let drawLayer = null;

function openEditor() {
  if (!imgEditor) return;
  imgEditor.classList.add('show');
  document.body.style.overflow = 'hidden';
  setMode('none');
  editUndoStack = [];
  if (ieColors) ieColors.classList.add('hidden');
  loadEditImage(editIndex);
}

function closeEditor() {
  if (!imgEditor) return;
  imgEditor.classList.remove('show');
  document.body.style.overflow = '';
  editImages = [];
  editIndex = 0;
  imageCaptions = [];
  imageDrawings = [];
  arrowObjects = [];
  if (ieColors) ieColors.classList.add('hidden');
  if (ieCaption) ieCaption.value = '';
  if (ieImage) ieImage.src = '';
  if (editCanvas) { editCanvas.remove(); editCanvas = null; editCtx = null; }
  drawLayer = null;
}

function loadEditImage(index) {
  const file = editImages[index];
  if (!file || !ieImage) return;
  if (drawLayer && editIndex < imageDrawings.length) {
    imageDrawings[editIndex] = drawLayer.getContext('2d').getImageData(0, 0, drawLayer.width, drawLayer.height);
  }
  if (ieCaption) imageCaptions[editIndex] = ieCaption.value;
  editIndex = index;
  if (ieCaption) ieCaption.value = imageCaptions[index] || '';
  const reader = new FileReader();
  reader.onload = (e) => {
    ieImage.src = e.target.result;
    ieImage.style.transform = '';
    if (ieCounter) ieCounter.textContent = `${index + 1}/${editImages.length}`;
    ieImage.onload = () => {
      setupEditCanvas();
      const dc = drawLayer.getContext('2d');
      if (imageDrawings[editIndex]) dc.putImageData(imageDrawings[editIndex], 0, 0);
      else dc.clearRect(0, 0, drawLayer.width, drawLayer.height);
      redrawScene();
    };
  };
  reader.readAsDataURL(file);
}

function setMode(mode) {
  editMode = mode;
  if (ieToolArrow) ieToolArrow.classList.toggle('active', mode === 'arrow');
  if (ieColors) ieColors.classList.toggle('hidden', mode !== 'arrow');
  if (editCanvas) editCanvas.style.cursor = mode === 'arrow' ? 'crosshair' : 'default';
  if (mode !== 'arrow') redrawScene();
}

function setupEditCanvas() {
  const old = document.querySelector('.ie-canvas-overlay');
  if (old) old.remove();
  editCanvas = document.createElement('canvas');
  editCanvas.className = 'ie-canvas-overlay';
  editCtx = editCanvas.getContext('2d');
  ieImageArea.appendChild(editCanvas);
  resizeCanvas();
  if (!drawLayer) drawLayer = document.createElement('canvas');
  if (drawLayer.width !== editCanvas.width || drawLayer.height !== editCanvas.height) {
    const oldContent = document.createElement('canvas');
    oldContent.width = drawLayer.width; oldContent.height = drawLayer.height;
    oldContent.getContext('2d').drawImage(drawLayer, 0, 0);
    drawLayer.width = editCanvas.width;
    drawLayer.height = editCanvas.height;
    drawLayer.getContext('2d').drawImage(oldContent, 0, 0);
  }

  editCanvas.addEventListener('mousedown', (e) => {
    if (editMode === 'arrow') startArrow(getEditPos(e));
  });
  editCanvas.addEventListener('mousemove', (e) => {
    if (isDrawingArrow && editMode === 'arrow') doArrow(getEditPos(e));
  });
  const endAll = () => endArrow();
  editCanvas.addEventListener('mouseup', endAll);
  editCanvas.addEventListener('mouseleave', endAll);
  editCanvas.addEventListener('touchstart', (e) => {
    if (editMode === 'none') return;
    e.preventDefault();
    if (editMode === 'arrow') startArrow(getEditPos(e));
  }, { passive: false });
  editCanvas.addEventListener('touchmove', (e) => {
    if (editMode === 'none') return;
    e.preventDefault();
    if (isDrawingArrow && editMode === 'arrow') doArrow(getEditPos(e));
  }, { passive: false });
  editCanvas.addEventListener('touchend', endAll, { passive: false });

  const ro = new ResizeObserver(() => resizeCanvas());
  ro.observe(ieImageArea);
}

function resizeCanvas() {
  if (!editCanvas) return;
  const r = editCanvas.getBoundingClientRect();
  const cw = Math.round(r.width), ch = Math.round(r.height);
  if (cw < 10 || ch < 10) return;
  if (editCanvas.width === cw && editCanvas.height === ch) return;
  if (drawLayer) {
    const tmp = document.createElement('canvas');
    tmp.width = drawLayer.width; tmp.height = drawLayer.height;
    tmp.getContext('2d').drawImage(drawLayer, 0, 0);
    drawLayer.width = cw; drawLayer.height = ch;
    drawLayer.getContext('2d').drawImage(tmp, 0, 0);
  }
  editCanvas.width = cw; editCanvas.height = ch;
  redrawScene();
}

function saveUndoState() {
  if (!editCanvas || !drawLayer) return;
  editUndoStack.push({
    drawData: drawLayer.getContext('2d').getImageData(0, 0, drawLayer.width, drawLayer.height),
    arrows: JSON.parse(JSON.stringify(arrowObjects[editIndex] || []))
  });
  if (editUndoStack.length > 20) editUndoStack.shift();
}

function redrawScene() {
  if (!editCtx || !editCanvas || !drawLayer) return;
  editCtx.clearRect(0, 0, editCanvas.width, editCanvas.height);
  editCtx.drawImage(drawLayer, 0, 0);
  (arrowObjects[editIndex] || []).forEach(a => drawArrowOnCtx(editCtx, a.x1, a.y1, a.x2, a.y2, a.color));
}

function startArrow(p) {
  isDrawingArrow = true;
  arrowStart = { x: p.x, y: p.y };
  arrowEnd = { x: p.x, y: p.y };
}

function doArrow(p) {
  if (!isDrawingArrow) return;
  arrowEnd = { x: p.x, y: p.y };
  redrawScene();
  drawArrowOnCtx(editCtx, arrowStart.x, arrowStart.y, arrowEnd.x, arrowEnd.y, editColor);
}

function endArrow() {
  if (!isDrawingArrow) return;
  isDrawingArrow = false;
  if (arrowStart && arrowEnd) {
    const dx = arrowEnd.x - arrowStart.x, dy = arrowEnd.y - arrowStart.y;
    if (Math.sqrt(dx * dx + dy * dy) > 10) {
      saveUndoState();
      arrowObjects[editIndex].push({ x1: arrowStart.x, y1: arrowStart.y, x2: arrowEnd.x, y2: arrowEnd.y, color: editColor });
    }
  }
  arrowStart = null;
  arrowEnd = null;
  redrawScene();
}

function drawArrowOnCtx(ctx, x1, y1, x2, y2, color) {
  const dx = x2 - x1, dy = y2 - y1;
  const len = Math.sqrt(dx * dx + dy * dy);
  if (len < 1) return;
  const angle = Math.atan2(dy, dx);
  const headLen = Math.min(16, len * 0.35);
  ctx.save();
  ctx.strokeStyle = color;
  ctx.fillStyle = color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - headLen * Math.cos(angle - 0.45), y2 - headLen * Math.sin(angle - 0.45));
  ctx.lineTo(x2 - headLen * Math.cos(angle + 0.45), y2 - headLen * Math.sin(angle + 0.45));
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

function getImageBounds() {
  const canvasRect = editCanvas.getBoundingClientRect();
  const imgRect = ieImage.getBoundingClientRect();
  return {
    x: Math.max(0, imgRect.left - canvasRect.left),
    y: Math.max(0, imgRect.top - canvasRect.top),
    w: Math.min(canvasRect.width, imgRect.width),
    h: Math.min(canvasRect.height, imgRect.height)
  };
}

function getEditPos(e) {
  const rect = editCanvas.getBoundingClientRect();
  const t = e.touches ? (e.touches[0] || e.changedTouches[0]) : e;
  let x = t.clientX - rect.left;
  let y = t.clientY - rect.top;
  if (editMode === 'arrow') {
    const b = getImageBounds();
    x = Math.max(b.x, Math.min(b.x + b.w, x));
    y = Math.max(b.y, Math.min(b.y + b.h, y));
  }
  return { x, y };
}

function renderEditedImage(index) {
  return new Promise((resolve, reject) => {
    const file = editImages[index];
    if (!file) return reject(new Error('No file'));
    const img = new Image();
    img.onload = () => {
      const origW = img.naturalWidth, origH = img.naturalHeight;
      const canvasRect = editCanvas ? editCanvas.getBoundingClientRect() : ieImageArea.getBoundingClientRect();
      const imgRect = ieImage.getBoundingClientRect();
      const offsetX = imgRect.left - canvasRect.left;
      const offsetY = imgRect.top - canvasRect.top;
      const dispW = imgRect.width, dispH = imgRect.height;
      const scaleX = origW / dispW, scaleY = origH / dispH;
      const c = document.createElement('canvas');
      c.width = origW;
      c.height = origH;
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      if (drawLayer) {
        ctx.save();
        ctx.translate(-offsetX * scaleX, -offsetY * scaleY);
        ctx.scale(scaleX, scaleY);
        ctx.drawImage(drawLayer, 0, 0);
        ctx.restore();
      }
      (arrowObjects[index] || []).forEach(a => {
        const ax1 = (a.x1 - offsetX) * scaleX, ay1 = (a.y1 - offsetY) * scaleY;
        const ax2 = (a.x2 - offsetX) * scaleX, ay2 = (a.y2 - offsetY) * scaleY;
        const dx = ax2 - ax1, dy = ay2 - ay1;
        const len = Math.sqrt(dx * dx + dy * dy);
        if (len < 1) return;
        const angle = Math.atan2(dy, dx);
        const headLen = Math.min(16 * scaleX, len * 0.35);
        ctx.save();
        ctx.strokeStyle = a.color;
        ctx.fillStyle = a.color;
        ctx.lineWidth = 4 * scaleX;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(ax1, ay1);
        ctx.lineTo(ax2, ay2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ax2, ay2);
        ctx.lineTo(ax2 - headLen * Math.cos(angle - 0.45), ay2 - headLen * Math.sin(angle - 0.45));
        ctx.lineTo(ax2 - headLen * Math.cos(angle + 0.45), ay2 - headLen * Math.sin(angle + 0.45));
        ctx.closePath();
        ctx.fill();
        ctx.restore();
      });
      c.toBlob(blob => blob ? resolve(blob) : reject(new Error('Blob failed')), 'image/jpeg', 0.9);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function compressImage(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      const maxDim = 1920;
      if (w > maxDim || h > maxDim) {
        const ratio = Math.min(maxDim / w, maxDim / h);
        w = Math.round(w * ratio);
        h = Math.round(h * ratio);
      }
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      canvas.toBlob(blob => {
        if (!blob) return reject(new Error('Compress failed'));
        resolve(new File([blob], file.name.replace(/\.[^.]+$/, '.jpg'), { type: 'image/jpeg' }));
      }, 'image/jpeg', 0.85);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

ieColorBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    ieColorBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    editColor = btn.dataset.color;
  });
});

ieToolArrow.addEventListener('click', () => setMode(editMode === 'arrow' ? 'none' : 'arrow'));
ieToolUndo.addEventListener('click', () => {
  if (editUndoStack.length === 0 || !drawLayer) return;
  const state = editUndoStack.pop();
  drawLayer.getContext('2d').putImageData(state.drawData, 0, 0);
  arrowObjects[editIndex] = state.arrows || [];
  redrawScene();
});
ieToolDone.addEventListener('click', () => setMode('none'));

camBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  editImages = [file];
  editIndex = 0;
  imageCaptions = [''];
  imageDrawings = [null];
  arrowObjects = [[]];
  editUndoStack = [];
  fileInput.value = '';
  openEditor();
});

function openEditor() {
  imgEditor.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeEditor() {
  imgEditor.classList.remove('show');
  document.body.style.overflow = '';
  pendingImgData = null;
  ieImage.src = '';
  ieCaption.value = '';
}

ieBack.addEventListener('click', closeEditor);
ieDeleteImg.addEventListener('click', closeEditor);

ieSendBtn.addEventListener('click', async () => {
  if (!editImages.length || !currentUserFP) return;
  const caption = ieCaption.value.trim();
  try {
    const blob = await renderEditedImage(editIndex);
    const name = editImages[editIndex].name.replace(/\.[^.]+$/, '.jpg');
    const file = new File([blob], name, { type: 'image/jpeg' });
    const compressed = await compressImage(file);
    const imageData = await fileToDataUrl(compressed);
    const text = '[Image]' + (caption ? ': ' + caption : '');
    const result = await SB.insert('messages', { fingerprint: currentUserFP, sender: 'team', text, category: currentCategory, image: imageData, sender_fp: 'AZC92M46' });
    closeEditor();
    if (result && result.id) {
      cachedMsgs.push(result);
      saveCache();
    }
    const userMsgs = cachedMsgs.filter(m => m.fingerprint === currentUserFP && m.category === currentCategory);
    renderChatMsgs(userMsgs);
    chatSub.textContent = userMsgs.length + ' messages in ' + currentCategory;
  } catch (err) {
    console.error('Image send failed', err);
    alert('Could not send image. Please try again.');
  }
});

// ─── Init ──────────────────────────────────────────────
renderDash();
});
</script>
